<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonder · Doojin Baek</title>
<meta name="description" content="궁금했던 논문과 개념을 슬라이드로 풀어 본 설명 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d2026;
    --muted: #6b7280;
    --accent: #2f5fb3;
    --soft: #edf2fa;
    --line: #e3e6ea;
    --bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6e8eb;
      --muted: #9aa1ab;
      --accent: #7ea6eb;
      --soft: #1c2433;
      --line: #2c3139;
      --bg: #14161a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", -apple-system, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  .home { color: var(--muted); font-size: 15px; text-decoration: none; }
  .home:hover { color: var(--accent); }
  h1 { margin: 20px 0 6px; font-size: 34px; letter-spacing: -0.01em; }
  .lead { margin: 0 0 36px; color: var(--muted); }

  ul { margin: 0; padding: 0; list-style: none; }
  li { margin: 0 0 14px; }
  li > a {
    display: block;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  li > a:hover { border-color: var(--accent); background: var(--soft); }
  .date { font-size: 14px; color: var(--muted); }
  .t { margin: 2px 0 4px; font-size: 19px; font-weight: 600; line-height: 1.4; }
  .s { font-size: 15px; color: var(--muted); }
  /* add-index.mjs also writes an "Artifact로 보기" link under each entry. Artifacts are private,
     so visitors could not open it: it stays in the file but is not shown here. */
  li > .s { display: none; }

  .empty { display: none; color: var(--muted); }
  ul:not(:has(li)) + .empty { display: block; }
</style>
</head>
<body>
<main>
  <a class="home" href="https://doojinbaek.github.io/">← Doojin Baek</a>
  <h1>Wonder</h1>
  <p class="lead">궁금했던 논문과 개념을 하나씩 슬라이드로 풀어 본 설명 모음입니다.</p>

  <ul>
  </ul>
  <p class="empty">아직 올린 덱이 없습니다.</p>
</main>
</body>
</html>
